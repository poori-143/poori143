<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permanent Makeup Booking</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#fff5f7;
}

header{
background:linear-gradient(135deg,#ff7eb3,#ff758c);
color:white;
padding:60px;
text-align:center;
}

header h1{
font-size:42px;
}

header p{
margin-top:10px;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:50px 0;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 6px 18px rgba(0,0,0,.1);
text-align:center;
}

.card:hover{
transform:translateY(-8px);
transition:.4s;
}

.card h3{
color:#ff4d88;
}

.booking{
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 6px 20px rgba(0,0,0,.1);
margin-bottom:50px;
}

.booking h2{
text-align:center;
color:#ff4d88;
margin-bottom:20px;
}

form{
display:flex;
flex-direction:column;
gap:15px;
}

input,select{
padding:15px;
border:1px solid #ddd;
border-radius:10px;
}

button{
padding:15px;
background:#ff4d88;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#ff2d74;
}

.confirm{
display:none;
background:#d4ffd9;
padding:20px;
margin-top:20px;
border-radius:10px;
}

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
}

@media(max-width:700px){
header h1{
font-size:30px;
}
}
</style>
</head>

<body>

<header>
<h1>Permanent Makeup Studio</h1>
<p>Book Your Beauty Appointment Online</p>
</header>

<div class="container">

<section class="services">

<div class="card">
<h3>Microblading</h3>
<p>Natural eyebrow enhancement</p>
</div>

<div class="card">
<h3>Lip Blush</h3>
<p>Soft permanent lip color</p>
</div>

<div class="card">
<h3>Eyeliner Tattoo</h3>
<p>Long lasting elegant look</p>
</div>

</section>

<section class="booking">

<h2>Book Appointment</h2>

<form id="bookingForm">

<input
type="text"
id="name"
placeholder="Enter Full Name"
required>

<input
type="tel"
id="phone"
placeholder="Phone Number"
required>

<select id="service" required>
<option value="">Choose Service</option>
<option>Microblading</option>
<option>Lip Blush</option>
<option>Eyeliner Tattoo</option>
</select>

<input
type="date"
id="date"
required>

<input
type="time"
id="time"
required>

<button type="submit">
Book Now
</button>

</form>

<div class="confirm" id="confirm"></div>

</section>

</div>

<footer>
© 2026 Permanent Makeup Studio
</footer>

<script>

const form=document.getElementById("bookingForm");

form.addEventListener("submit",function(e){

e.preventDefault();

let name=
document.getElementById("name").value;

let phone=
document.getElementById("phone").value;

let service=
document.getElementById("service").value;

let date=
document.getElementById("date").value;

let time=
document.getElementById("time").value;

let msg=
`
<h3>Booking Confirmed 🎉</h3>

<p><b>Name:</b> ${name}</p>

<p><b>Phone:</b> ${phone}</p>

<p><b>Service:</b> ${service}</p>

<p><b>Date:</b> ${date}</p>

<p><b>Time:</b> ${time}</p>
`;

let confirm=
document.getElementById("confirm");

confirm.innerHTML=msg;

confirm.style.display="block";

form.reset();

});

</script>

</body>
</html>
